<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <!-- <h2 class="footer-heading">{{ site.longtitle | escape }}</h2> -->

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
              {{ site.author | escape }}
            {%- else -%}
              {{ site.longtitle | escape }}
            {%- endif -%}
            </li>
            {%- if site.email -%}
            <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
            {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>

      <div class="footer-col footer-col-3 footer-logos">
        <a href="https://ff.uns.ac.rs/">
          <img
            src="{{ '/assets/images/ffuns.png' | relative_url }}"
            alt="Faculty of Philosophy, University of Novi Sad"
          >
        </a>
        <a href="https://www.uns.ac.rs/">
          <img
            src="{{ '/assets/images/uns.png' | relative_url }}"
            alt="University of Novi Sad"
          >
        </a>
      </div>
    </div>

  </div>

</footer>
